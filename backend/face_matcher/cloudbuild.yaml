substitutions:
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/heart/face-matcher

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/face_matcher/Dockerfile
      - -t
      - $_IMAGE
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE

images:
  - $_IMAGE
